<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a11">
<meta name="description" content="Mini site do Dr. Douglas Martins.">
<title>Dr. Douglas Martins</title>
<style>
:root{color-scheme:dark;--bg:#080a11}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:var(--bg)}
html{scroll-behavior:smooth}
body{overflow-x:hidden;isolation:isolate}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;width:70vw;height:70vw;max-width:520px;max-height:520px;border-radius:50%;filter:blur(80px);opacity:.10;animation:ambient 14s ease-in-out infinite alternate}
body::before{top:-24vw;left:-28vw;background:#5268ff}
body::after{right:-30vw;bottom:-20vw;background:#8e45bd;animation-delay:-7s}
main{position:relative;z-index:1;width:100%;max-width:100%;margin:0 auto;line-height:0;background:var(--bg)}
.poster{display:block;width:100%;height:auto;max-width:100%;margin:0;opacity:0;transform:translateY(18px) scale(.995);transform-origin:top center;filter:blur(3px);animation:enter 1.1s cubic-bezier(.2,.75,.25,1) .12s forwards;box-shadow:0 0 45px #0002}
.status{display:none;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:32px 20px;line-height:1.5}
@keyframes enter{to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes ambient{from{transform:translate3d(0,-2vh,0) scale(.9)}to{transform:translate3d(6vw,8vh,0) scale(1.12)}}
@media(min-width:700px){main{max-width:600px}body::before,body::after{opacity:.07}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}body::before,body::after{animation:none}.poster{animation:none;opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<main aria-label="Mini site do Dr. Douglas Martins">
<img class="poster" src="./design-original.jpg" alt="Mini site do Dr. Douglas Martins" width="2732" height="16000" fetchpriority="high" decoding="async" onerror="this.style.display='none';document.getElementById('status').style.display='block'">
<div class="status" id="status" role="alert">Não foi possível carregar a imagem. Confira se o arquivo <strong>design-original.jpg</strong> está no mesmo nível do arquivo <strong>index.html</strong>.</div>
</main>
</body>
</html>
