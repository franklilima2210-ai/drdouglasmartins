<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a11">
  <meta name="description" content="Mini site do Dr. Douglas Martins.">
  <title>Dr. Douglas Martins</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080a11; }
    body { display: flex; justify-content: center; align-items: flex-start; overflow-x: hidden; }
    main { width: 100%; max-width: 349px; margin: 0 auto; line-height: 0; animation: fade-in .7s ease-out both; }
    img { display: block; width: 100%; height: auto; }
    .fallback { display: none; max-width: 349px; padding: 28px 20px; color: #fff; font: 16px/1.5 Arial, sans-serif; text-align: center; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main aria-label="Mini site do Dr. Douglas Martins">
    <img id="design" src="./design-original.jpg" alt="Mini site do Dr. Douglas Martins" width="2732" height="16000" fetchpriority="high">
    <section class="fallback" id="fallback" role="alert">
      <p>Não foi possível carregar a imagem do mini site.</p>
      <p>Confira se o arquivo <strong>design-original.jpg</strong> está na mesma pasta do <strong>index.html</strong>.</p>
    </section>
  </main>
  <script>
    document.getElementById('design').addEventListener('error', function () {
      this.style.display = 'none';
      document.getElementById('fallback').style.display = 'block';
    });
  </script>
</body>
</html>
