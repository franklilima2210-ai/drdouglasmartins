<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a11">
<meta name="description" content="Mini site do Dr. Douglas Martins.">
<title>Dr. Douglas Martins</title>
<style>
:root{color-scheme:dark;--bg:#080a11}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:var(--bg)}
html{scroll-behavior:smooth}
body{overflow-x:hidden;isolation:isolate}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:62vw;height:62vw;max-width:520px;max-height:520px;border-radius:50%;filter:blur(70px);opacity:.12;animation:ambient-drift 13s ease-in-out infinite alternate}
body::before{top:-18vw;left:-24vw;background:#5268ff}
body::after{right:-28vw;bottom:-18vw;background:#8e45bd;animation-delay:-6s}
main{display:block;width:100vw;max-width:100%;margin:0 auto;line-height:0;overflow:clip;background:var(--bg)}
.slice{display:block;width:100%;max-width:100%;height:auto;margin:0;padding:0;opacity:0;transform:translate3d(0,42px,0) scale(.975);filter:blur(5px) brightness(1.08);transform-origin:center center;transition:opacity .8s ease,transform 1.05s cubic-bezier(.16,.78,.22,1),filter 1s ease;will-change:opacity,transform,filter;backface-visibility:hidden}
.slice.is-visible{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0) brightness(1)}
.slice:nth-child(even){transform:translate3d(22px,28px,0) scale(.98)}
.slice:nth-child(even).is-visible{transform:translate3d(0,0,0) scale(1)}
.slice:nth-child(3n+1).is-visible{animation:soft-settle 1.15s cubic-bezier(.16,.78,.22,1) both}
@keyframes soft-settle{0%{transform:translate3d(0,46px,0) scale(.97)}68%{transform:translate3d(0,-4px,0) scale(1.004)}100%{transform:translate3d(0,0,0) scale(1)}}
@keyframes ambient-drift{from{transform:translate3d(0,-2vh,0) scale(.92)}to{transform:translate3d(7vw,9vh,0) scale(1.12)}}
.fallback{display:none;padding:28px 20px;color:#fff;font:16px/1.5 Arial,sans-serif;text-align:center}
@media(min-width:600px){main{width:min(100%,520px)}body::before,body::after{opacity:.08}}
@media(max-width:359px){.slice{transition-duration:.65s,.8s,.8s}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}body::before,body::after{animation:none}.slice,.slice.is-visible,.slice:nth-child(even),.slice:nth-child(even).is-visible{opacity:1;transform:none;filter:none;transition:none;animation:none}}
</style>
</head>
<body>
<main aria-label="Mini site do Dr. Douglas Martins">
  <img class="slice" src="./assets/parte-01.jpg" alt="Mini site do Dr. Douglas Martins" width="2732" height="2000" fetchpriority="high" decoding="async">
  <img class="slice" src="./assets/parte-02.jpg" alt="" width="2732" height="2000" loading="lazy" decoding="async">
  <img class="slice" src="./assets/parte-03.jpg" alt="" width="2732" height="2000" loading="lazy" decoding="async">
  <img class="slice" src="./assets/parte-04.jpg" alt="" width="2732" height="2000" loading="lazy" decoding="async">
  <img class="slice" src="./assets/parte-05.jpg" alt="" width="2732" height="2000" loading="lazy" decoding="async">
  <img class="slice" src="./assets/parte-06.jpg" alt="" width="2732" height="2000" loading="lazy" decoding="async">
  <img class="slice" src="./assets/parte-07.jpg" alt="" width="2732" height="2000" loading="lazy" decoding="async">
  <img class="slice" src="./assets/parte-08.jpg" alt="" width="2732" height="2000" loading="lazy" decoding="async">
  <section class="fallback" id="fallback" role="alert"><p>Não foi possível carregar uma parte do mini site.</p><p>Confira se a pasta <strong>assets</strong> e as oito imagens estão junto do <strong>index.html</strong>.</p></section>
</main>
<script>
(() => {
  const images = [...document.querySelectorAll('.slice')];
  const fallback = document.getElementById('fallback');
  images.forEach(img => img.addEventListener('error', () => {
    fallback.style.display = 'block'; img.style.display = 'none';
  }));
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.style.transitionDelay = `${(images.indexOf(img) % 3) * 110}ms`;
          img.classList.add('is-visible');
          observer.unobserve(img);
        }
      });
    }, { rootMargin: '0px 0px -7% 0px', threshold: 0.03 });
    images.forEach(img => observer.observe(img));
  } else images.forEach(img => img.classList.add('is-visible'));
})();
</script>
</body>
</html>
