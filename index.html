<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a11">
<meta name="description" content="Mini site do Dr. Douglas Martins.">
<title>Dr. Douglas Martins</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; width: 100%; background: #080a11; }
body { overflow-x: hidden; }
main { width: 100%; max-width: 100%; margin: 0 auto; line-height: 0; overflow: clip; }
.slice { display: block; width: 100%; height: auto; margin: 0; opacity: 0; transform: translate3d(0, 34px, 0) scale(.99); filter: blur(3px) brightness(1.04); transition: opacity .75s ease, transform .95s cubic-bezier(.18,.72,.22,1), filter .9s ease; will-change: opacity, transform, filter; }
.slice.is-visible { opacity: 1; transform: translate3d(0,0,0) scale(1); filter: blur(0) brightness(1); }
.slice:nth-child(3n+1).is-visible { animation: settle-in .95s cubic-bezier(.18,.72,.22,1) both; }
@keyframes settle-in { 0% { transform: translate3d(0,40px,0) scale(.985); } 70% { transform: translate3d(0,-3px,0) scale(1.002); } 100% { transform: translate3d(0,0,0) scale(1); } }
.fallback { display:none; max-width: 100%; padding: 28px 20px; color: #fff; font: 16px/1.5 Arial,sans-serif; text-align:center; }
@media (min-width: 900px) { main { max-width: 520px; } }
@media (prefers-reduced-motion: reduce) { .slice, .slice.is-visible { opacity:1; transform:none; filter:none; transition:none; animation:none; } }
</style>
</head>
<body>
<main aria-label="Mini site do Dr. Douglas Martins">
  <img class="slice" src="./assets/parte-01.jpg" alt="Mini site do Dr. Douglas Martins" width="2732" height="2000" fetchpriority="high">
  <img class="slice" src="./assets/parte-02.jpg" alt="" width="2732" height="2000" loading="lazy">
  <img class="slice" src="./assets/parte-03.jpg" alt="" width="2732" height="2000" loading="lazy">
  <img class="slice" src="./assets/parte-04.jpg" alt="" width="2732" height="2000" loading="lazy">
  <img class="slice" src="./assets/parte-05.jpg" alt="" width="2732" height="2000" loading="lazy">
  <img class="slice" src="./assets/parte-06.jpg" alt="" width="2732" height="2000" loading="lazy">
  <img class="slice" src="./assets/parte-07.jpg" alt="" width="2732" height="2000" loading="lazy">
  <img class="slice" src="./assets/parte-08.jpg" alt="" width="2732" height="2000" loading="lazy">
  <section class="fallback" id="fallback" role="alert"><p>Não foi possível carregar uma parte do mini site.</p><p>Confira se a pasta <strong>assets</strong> e as oito imagens estão junto do <strong>index.html</strong>.</p></section>
</main>
<script>
(() => {
  const images = [...document.querySelectorAll('.slice')];
  const fallback = document.getElementById('fallback');
  images.forEach((img, i) => {
    img.addEventListener('error', () => { fallback.style.display = 'block'; img.style.display = 'none'; });
  });
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.style.transitionDelay = `${(images.indexOf(img) % 2) * 100}ms`;
          img.classList.add('is-visible');
          observer.unobserve(img);
        }
      });
    }, { rootMargin: '0px 0px -5% 0px', threshold: 0.04 });
    images.forEach(img => observer.observe(img));
  } else images.forEach(img => img.classList.add('is-visible'));
})();
</script>
</body>
</html>
